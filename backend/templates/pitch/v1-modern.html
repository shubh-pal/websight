<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pitch Deck — v1 Modern</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&family=Open+Sans:wght@400;500&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #e2e8f0; font-family: 'Inter', sans-serif; }
  .toolbar { position: sticky; top: 0; z-index: 50; background: #0f172a; color: #fff; padding: 10px 20px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  .toolbar strong { font-weight: 700; }
  .toolbar span { color: #94a3b8; }
  .stage { padding: 40px 0 100px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .slide {
    width: 1280px; height: 720px; position: relative; overflow: hidden;
    background: #ffffff; box-shadow: 0 20px 50px rgba(0,0,0,0.25); border-radius: 4px;
    flex-shrink: 0;
  }
  .pad { padding: 64px 72px; height: 100%; box-sizing: border-box; }
  h1, h2, h3 { font-family: 'Poppins', sans-serif; margin: 0; letter-spacing: -0.02em; }
  .eyebrow { text-transform: uppercase; letter-spacing: 0.16em; font-size: 13px; font-weight: 700; }
  .eyebrow.light { color: rgba(255,255,255,0.85); }
  p { font-family: 'Open Sans', sans-serif; line-height: 1.6; font-size: 17px; color: #475569; margin: 0; }
  .slide-num { position: absolute; bottom: 28px; right: 32px; font-size: 12px; color: #94a3b8; font-family: 'Inter'; letter-spacing: 0.06em; }

  /* Cover */
  .cover { color: #fff; }
  .cover-bg { position: absolute; inset: 0; }
  .cover-bg img, .cover-bg .placeholder { width: 100%; height: 100%; object-fit: cover; }
  .cover-scrim { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(15,23,42,0.15) 0%, rgba(15,23,42,0.92) 78%); }
  .cover-content { position: relative; z-index: 2; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; }
  .cover-content h1 { font-size: 50px; color: #fff; line-height: 1.12; max-width: 980px; margin: 18px 0 14px; }
  .cover-content .meta { font-size: 16px; color: rgba(255,255,255,0.75); }
  .brand-row { position: absolute; top: 40px; left: 72px; right: 72px; z-index: 3; display: flex; justify-content: space-between; align-items: center; }
  .brand-row img { height: 30px; object-fit: contain; filter: brightness(0) invert(1); }
  .brand-row .agency-name { color: #fff; font-weight: 700; font-size: 15px; }

  .section-head { margin-bottom: 30px; }
  .section-head h2 { font-size: 34px; margin-top: 8px; color: #0f172a; }

  /* Split slide */
  .split { display: flex; height: 100%; }
  .split .left { flex: 0 0 46%; background: #0f172a; position: relative; }
  .split .left img, .split .left .placeholder { width: 100%; height: 100%; object-fit: cover; }
  .split .right { flex: 1; padding: 64px 56px; display: flex; flex-direction: column; justify-content: center; }
  .reason-card { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 18px; }
  .reason-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
  .reason-card p { font-size: 17px; color: #1e293b; }

  /* Brand direction */
  .swatch-row { display: flex; gap: 14px; margin: 26px 0 22px; flex-wrap: wrap; }
  .swatch { text-align: center; }
  .chip { width: 56px; height: 56px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 6px; }
  .swatch span { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.06em; }
  .type-sample { display: flex; gap: 40px; margin-top: 16px; }
  .type-sample div span { display: block; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .type-sample div strong { font-size: 26px; }

  /* Before/after */
  .ba { display: flex; height: 100%; }
  .ba figure { flex: 1; margin: 0; position: relative; }
  .ba img, .ba .placeholder { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ba figcaption { position: absolute; top: 24px; left: 24px; padding: 6px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; z-index: 2; }
  .ba .before figcaption { background: rgba(15,23,42,0.75); color: #fff; }
  .ba .after figcaption { color: #fff; }
  .ba-divider { width: 4px; }

  /* Scope */
  .scope { color: #fff; display: flex; align-items: center; }
  .scope-inner { padding: 0 72px; width: 100%; }
  .scope .price { font-size: 96px; font-weight: 800; letter-spacing: -0.03em; margin: 14px 0 10px; font-family: 'Poppins'; }
  .scope .tagline { font-size: 19px; color: rgba(255,255,255,0.85); max-width: 640px; }
  .scope-facts { display: flex; gap: 40px; margin-top: 34px; }
  .scope-facts div { font-size: 15px; color: rgba(255,255,255,0.9); }
  .scope-facts strong { display: block; font-size: 22px; margin-bottom: 4px; }

  /* CTA */
  .cta-slide { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
  .cta-slide img.logo { height: 46px; object-fit: contain; margin-bottom: 28px; }
  .cta-slide h1 { font-size: 44px; max-width: 780px; }
  .cta-btn { margin-top: 30px; padding: 16px 34px; border-radius: 12px; color: #fff; font-weight: 700; font-size: 17px; text-decoration: none; }
  .contact-row { margin-top: 34px; font-size: 15px; color: #64748b; display: flex; gap: 22px; }

  /* Placeholder mockup (shown when a screenshot variable is empty) */
  .placeholder { background: #f1f5f9; display: flex; flex-direction: column; }
  .placeholder .chrome { background: #1e293b; padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
  .placeholder .dot { width: 9px; height: 9px; border-radius: 50%; }
  .placeholder .url { flex: 1; height: 16px; background: rgba(255,255,255,0.15); border-radius: 999px; margin-left: 10px; }
  .placeholder .body { flex: 1; padding: 28px; display: flex; flex-direction: column; gap: 14px; }
  .placeholder .bar { height: 14px; background: #cbd5e1; border-radius: 4px; }
  .placeholder .label { position: absolute; bottom: 16px; left: 16px; right: 16px; text-align: center; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; font-family: 'Inter'; }
</style>
</head>

<div class="stage" id="stage"></div>

<script>
function placeholderMockup(label) {
  return `<div class="placeholder">
    <div class="chrome"><div class="dot" style="background:#ef4444"></div><div class="dot" style="background:#eab308"></div><div class="dot" style="background:#22c55e"></div><div class="url"></div></div>
    <div class="body">
      <div class="bar" style="width:60%;height:22px"></div>
      <div class="bar" style="width:90%"></div>
      <div class="bar" style="width:80%"></div>
      <div class="bar" style="width:40%;height:34px;margin-top:8px"></div>
    </div>
    <div class="label">${label}</div>
  </div>`;
}
function media(url, label) { return url ? `<img src="${url}" />` : placeholderMockup(label); }

function render(D) {
  const c = D.designSystem.colors;
  const accent = c.primary || '#6366f1';
  const dark = '#0f172a';
  const grad = `linear-gradient(135deg, ${accent}, ${dark})`;
  const headingFont = D.designSystem.fonts.heading ? `'${D.designSystem.fonts.heading}', Poppins, sans-serif` : "Poppins, sans-serif";
  const bodyFont = D.designSystem.fonts.body ? `'${D.designSystem.fonts.body}', 'Open Sans', sans-serif` : "'Open Sans', sans-serif";
  document.documentElement.style.setProperty('--heading-font', headingFont);
  document.querySelectorAll('h1,h2,h3').forEach(()=>{});

  const priceRange = `$${D.pricing.min}–$${D.pricing.max}`;

  return `
  <div class="slide cover" style="background:${grad}">
    <div class="brand-row">
      ${D.agency.logoUrl ? `<img src="${D.agency.logoUrl}" />` : `<span class="agency-name">${D.agency.name}</span>`}
      <span class="eyebrow light">Website Redesign Proposal</span>
    </div>
    <div class="cover-bg">${media(D.newDesignScreenshotUrl, 'New design screenshot (variable: newDesignScreenshotUrl)')}</div>
    <div class="cover-scrim"></div>
    <div class="cover-content pad">
      <span class="eyebrow light">Prepared for ${D.business.name} · ${D.business.location}</span>
      <h1 style="font-family:${headingFont}">${D.business.headline}</h1>
      <span class="meta">${D.business.category}</span>
    </div>
  </div>

  <div class="slide">
    <div class="split">
      <div class="left">${media(D.currentScreenshotUrl, 'Current site screenshot (variable: currentScreenshotUrl)')}</div>
      <div class="right">
        <div class="eyebrow" style="color:${accent}">What we noticed</div>
        <h2 style="font-size:32px;margin:10px 0 26px;font-family:${headingFont}">Your site today</h2>
        ${D.business.auditReasons.map(r => `<div class="reason-card"><div class="reason-dot" style="background:${accent}"></div><p>${r}</p></div>`).join('')}
      </div>
    </div>
  </div>

  <div class="slide">
    <div class="pad">
      <div class="section-head">
        <div class="eyebrow" style="color:${accent}">Brand direction</div>
        <h2 style="font-family:${headingFont}">Where we'd take it</h2>
      </div>
      <p style="max-width:820px;font-size:18px">${D.business.positioning}</p>
      <div class="swatch-row">
        ${Object.entries(c).map(([k,v]) => `<div class="swatch"><div class="chip" style="background:${v}"></div><span>${k}</span></div>`).join('')}
      </div>
      <div class="type-sample">
        <div><span>Heading</span><strong style="font-family:${headingFont}">${D.designSystem.fonts.heading}</strong></div>
        <div><span>Body</span><strong style="font-family:${bodyFont};font-weight:400">${D.designSystem.fonts.body}</strong></div>
      </div>
    </div>
  </div>

  <div class="slide">
    <div class="ba">
      <figure class="before">${media(D.currentScreenshotUrl, 'currentScreenshotUrl')}<figcaption>Before</figcaption></figure>
      <div class="ba-divider" style="background:${accent}"></div>
      <figure class="after">${media(D.newDesignScreenshotUrl, 'newDesignScreenshotUrl')}<figcaption style="background:${accent}">After</figcaption></figure>
    </div>
  </div>

  <div class="slide scope" style="background:${grad}">
    <div class="scope-inner">
      <span class="eyebrow light">Scope &amp; investment</span>
      <div class="price">${priceRange}</div>
      <p class="tagline">${D.agency.tagline}</p>
      <div class="scope-facts">
        <div><strong>~${D.pricing.days} days</strong>delivery</div>
        <div><strong>Fully responsive</strong>desktop, tablet, mobile</div>
        <div><strong>Your brand</strong>built on what you already have</div>
      </div>
    </div>
  </div>

  <div class="slide">
    <div class="cta-slide">
      ${D.agency.logoUrl ? `<img class="logo" src="${D.agency.logoUrl}" />` : `<div class="eyebrow" style="color:${accent};margin-bottom:20px">${D.agency.name}</div>`}
      <h1 style="font-family:${headingFont}">Let's build ${D.business.name} a website that works as hard as you do.</h1>
      <a class="cta-btn" style="background:${accent}" href="mailto:${D.agency.email}">Get started</a>
      <div class="contact-row">
        <span>${D.agency.name}</span><span>${D.agency.website}</span><span>${D.agency.email}</span><span>${D.agency.phone}</span>
      </div>
    </div>
  </div>
  `;
}

document.getElementById('stage').innerHTML = render(window.PITCH_DATA);
// add slide numbers
document.querySelectorAll('.slide').forEach((el, i) => {
  const n = document.createElement('div');
  n.className = 'slide-num';
  n.textContent = `${String(i+1).padStart(2,'0')} / ${document.querySelectorAll('.slide').length}`;
  el.appendChild(n);
});
</script>

</body>
</html>
