<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #d8d3c4; font-family: 'Inter', sans-serif; }
  .toolbar { position: sticky; top: 0; z-index: 50; background: #12181f; color: #fff; padding: 10px 20px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
  .toolbar span { color: #94a3b8; }
  .stage { padding: 40px 0 100px; display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .slide {
    width: 1280px; height: 720px; position: relative; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25); flex-shrink: 0;
  }
  .cream { background: #f5f1ea; color: #12181f; }
  .dark { background: #12181f; color: #fff; }
  .teal { background: #2bbfa4; color: #12181f; }
  .pad { padding: 56px 68px; height: 100%; box-sizing: border-box; position: relative; z-index: 2; }
  h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .kicker { text-transform: uppercase; letter-spacing: 0.14em; font-size: 12.5px; font-weight: 700; }
  p { line-height: 1.6; font-size: 16px; color: #4b5563; margin: 0; }
  .dark p { color: rgba(255,255,255,0.72); }
  .page-num { position: absolute; bottom: 24px; right: 32px; font-size: 12px; font-weight: 700; z-index: 3; }
  .divider { border: none; border-top: 1.5px solid rgba(0,0,0,0.12); margin: 14px 0 0; }

  /* Blobs */
  .blob { position: absolute; border-radius: 50%; z-index: 1; }

  /* Browser chrome mockup / placeholder */
  .mock { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,0.25); position: relative; z-index: 2; }
  .mock .chrome { background: #12181f; padding: 12px 16px; display: flex; align-items: center; gap: 8px; }
  .mock .dot { width: 9px; height: 9px; border-radius: 50%; }
  .mock .url { flex: 1; height: 18px; background: rgba(255,255,255,0.14); border-radius: 999px; margin-left: 10px; }
  .mock .frame { width: 100%; height: 340px; object-fit: cover; display: block; }
  .mock .placeholder-body { width: 100%; height: 340px; background: #eef1f5; padding: 26px; display: flex; flex-direction: column; gap: 12px; }
  .mock .bar { height: 13px; background: #cbd5e1; border-radius: 4px; }
  .mock .label { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; }

  /* Pills / cards */
  .pill { display: inline-flex; align-items: center; padding: 12px 22px; border-radius: 999px; font-weight: 700; font-size: 13px; letter-spacing: 0.02em; }
  .card { border-radius: 18px; padding: 22px 26px; }
  .card-cream { background: #fdfcf9; box-shadow: 0 10px 26px rgba(0,0,0,0.06); }
  .card-dark { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); }

  .num-badge { font-size: 15px; font-weight: 700; }
</style>
